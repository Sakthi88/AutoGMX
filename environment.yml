name: md_pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core scientific computing
  - python>=3.10
  - numpy>=1.26
  - scipy>=1.11
  - scikit-learn>=1.4
  - networkx>=3.0
  - packaging>=23.0

  # Molecular dynamics & analysis
  - mdanalysis>=2.7
  - acpype>=2023.10.18

  # Web framework
  - flask>=3.0
  - werkzeug>=3.0

  # Data visualization
  - matplotlib>=3.8

  # Web scraping & parsing
  - beautifulsoup4>=4.12
  - mechanize>=0.4.0

  # PDF report generation
  - reportlab>=4.0

  # Optional: for enhanced performance
  # - mpi4py>=3.1
  # - openmm>=8.0

  # Build tools
  - pip
  - pip:
      # Any packages only available via pip
      - flask>=3.0,<4.0