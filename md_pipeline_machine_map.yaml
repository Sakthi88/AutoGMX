    ligand_topology2.py: "Ligand topology-related utility script present in root."
    paramchem2.py: "ParamChem/CGenFF-related helper script present in root."
  directories:
    steps: "Bash scripts for MD workflow stages."
    helpers: "Python helper scripts for configuration, topology, plotting, analysis, and reporting."
    lib: "Shared Bash runtime library."
    mdp: "GROMACS MDP templates for ions, minimization, equilibration, and production."
    charmm36-feb2026_cgenff-5.0.ff: "Bundled/local CHARMM36 force-field directory with CGenFF 5.0 support."
    webapp: "Flask user interface and background launcher."
    hpc: "Slurm/PBS scheduler templates, HPC wrapper, and example cluster configuration."
    web_jobs: "Saved web-submitted job directories, inputs, outputs, logs, and results."
    logs: "Pipeline logs for local/direct runs."
    state: "Restart sentinel files and auto-rectification runtime overrides."

configuration_parameters:
  path_parameters:
    PROJECT_NAME: "Human-readable project name."
    INPUT_DIR: "Input directory."
    WORK_DIR: "Intermediate working directory."
    RESULTS_DIR: "Simulation results directory."
    LOG_DIR: "Log directory."
    STATE_DIR: "Restart state directory."
    ANALYSIS_DIR: "Analysis output directory."
    TMP_DIR: "Temporary file directory."
  input_parameters:
    PROTEIN_PDB: "Protein input PDB path."
    LIGAND_INPUT: "Ligand input path, commonly MOL2."
    LIGAND_INPUT_FORMAT: "Ligand source format."
    DOCKING_COMPLEX_PDB: "Optional docked complex PDB to split into protein and ligand."
    DOCKING_LIGAND_RESNAME: "Ligand residue name used when splitting a docked complex."
  external_binary_parameters:
    GMX_BIN: "GROMACS executable, usually gmx."
    MPI_LAUNCHER: "Optional MPI launcher prefix."
    PYTHON_BIN: "Python executable."
    OBABEL_BIN: "Open Babel executable."
    ACPYPE_BIN: "ACPYPE executable."
    CGENFF_BIN: "CGenFF executable."
    CGENFF_CONVERTER: "CGenFF-to-GROMACS conversion script."
    PYPOLYBUILDER_BIN: "pyPolyBuilder executable."
  science_parameters:
    FORCE_FIELD: "Protein/system force field, default amber99sb-ildn."
    WATER_MODEL: "Water model, default tip3p."
    LIGAND_PREP_TOOL: "Ligand method: acpype, cgenff, pypolybuilder, or prepared_topology."
    LIGAND_RESNAME: "Residue name assigned to ligand, default LIG."
    LIGAND_NET_CHARGE: "Formal net charge used for ACPYPE ligand parameterization."
    BOX_TYPE: "GROMACS box type, default dodecahedron."
    BOX_DISTANCE_NM: "Solvent margin around complex in nm."
    ION_CONCENTRATION_M: "Salt concentration in molar units."
    TEMPERATURE_K: "Simulation temperature."
    PRESSURE_BAR: "Simulation pressure."
    EM_STEPS: "Energy minimization step count."
    NVT_TIME_PS: "NVT equilibration duration in ps unless NVT_STEPS is given."
    NPT_TIME_PS: "NPT equilibration duration in ps unless NPT_STEPS is given."
    MD_TIME_NS: "Production MD duration in ns."
    TIMESTEP_PS: "MD timestep in ps."
  compute_parameters:
    USE_GPU: "auto, yes, or no."
    GPU_ID: "Optional GPU identifier."
    NTMPI: "MPI ranks for mdrun."
    NTOMP: "OpenMP threads; auto uses available CPU allocation."
    PIN_THREADS: "GROMACS thread pinning setting."
  hpc_parameters:
    MPI_LAUNCHER: "Scheduler/MPI launcher such as srun or mpirun -np N."
    GMX_BIN: "Set in submit script; use gmx for thread-MPI/local builds or gmx_mpi for external-MPI builds."
    NTMPI: "Use 0 when running external-MPI gmx_mpi through srun/mpirun; otherwise use a positive value for thread-MPI builds."
    NTOMP: "Usually mapped from Slurm --cpus-per-task or PBS OMP_NUM_THREADS."
    USE_GPU: "Set auto, yes, or no in the submit script according to node type."
  analysis_parameters:
    RUN_RESULT_ANALYSIS: "Whether to run normal GROMACS result analysis."
    RUN_FREE_ENERGY: "Whether to run PCA/free-energy landscape analysis."
    RUN_UMBRELLA: "Placeholder/summary path for umbrella analysis."
    RUN_MMBSA: "Whether MM-PBSA is enabled."
    MD_CENTER_NOJUMP: "Whether to apply pbc nojump before centering."
    MD_CENTER_GROUP: "Group used for trajectory centering."
    MD_CENTER_OUTPUT_GROUP: "Output group for centered trajectory."
    ANALYSIS_FIT_GROUP: "Fit group for RMSD."
    ANALYSIS_RMS_GROUP: "Protein/group used for RMSD/RMSF/gyration."
    ANALYSIS_LIGAND_GROUP: "Ligand group used for ligand RMSD and hydrogen bonds."
  mmpbsa_parameters:
    MMBSA_FRAME_STEP: "Analyze every Nth frame."
    MMBSA_IONIC_STRENGTH: "Ionic strength for PB calculation."
    MMBSA_DECOMPOSE: "Enable per-residue decomposition if yes."
    MMBSA_USE_APBS: "Use APBS for polar solvation if yes."
    MMBSA_SURFACE_TENSION: "Surface tension coefficient for nonpolar solvation."

