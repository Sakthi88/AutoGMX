verification_scope:
  code_review_only: true
  gromacs_executed: false
  ambertools_executed: false
  simulation_verified: false
  note: "This file maps the codebase structure and intended behavior only. It does not claim a new MD run was executed."

manuscript_instruction:
  role: "Use this file as the complete technical source for drafting a manuscript, methods section, workflow description, or software note."
  writing_goal: "Convert the structured map into a clear scientific manuscript describing the automation tool, its workflow, implementation, inputs, outputs, rationale, and limitations."
  preferred_style: "Formal scientific software-description style."
  do_not_claim:
    - "Do not claim that a new simulation was run during this analysis."
    - "Do not claim experimental validation unless separate result data are supplied."
    - "Do not remove the warning that README.md contains unresolved conflict markers."

tool_identity:
  name: "AutoGMX"
  class: "Molecular dynamics automation pipeline"
  domain: "Computational chemistry, structural biology, protein-ligand simulation"
  primary_engine: "GROMACS command-line tools"
  orchestration_language: "Bash"
  helper_language: "Python"
  optional_user_interface: "Flask web application"
  main_value: "Transforms a multi-stage protein-ligand MD workflow into a restart-safe, configurable, semi-automated pipeline."

high_level_summary:
  what_the_tool_does:
    - "Accepts protein and ligand inputs, or a docked protein-ligand complex."
    - "Prepares protein topology using GROMACS pdb2gmx."
    - "Prepares ligand topology using ACPYPE, CGenFF, pyPolyBuilder, or uploaded prepared topology files."
    - "Assembles protein and ligand into one simulation system."
    - "Defines a simulation box, solvates the system, and adds ions."
    - "Runs energy minimization, NVT equilibration, NPT equilibration, and production MD."
    - "Processes trajectories to reduce periodic boundary artifacts."
    - "Generates structural analysis metrics, plots, optional PCA/free-energy landscapes, MM-PBSA estimates, and a PDF report."
  why_the_tool_is_needed:
    - "Manual GROMACS workflows contain many dependent commands and fragile file relationships."
    - "Ligand topology generation is a common failure point in protein-ligand MD."
    - "Force-field, water-model, and ligand-preparation compatibility must be handled carefully."
    - "Restart-safe execution is useful for long simulations and failed intermediate steps."
    - "Human-readable plots and machine-readable CSV/JSON outputs support downstream manuscript preparation."

global_runtime_model:
  execution_model:
    - "run_pipeline.sh is the central controller."
    - "Each step is an independent Bash script in the steps/ directory."
    - "Each step checks for a matching state/*.done sentinel file before running."
    - "Logs are written per step under logs/."
    - "Configuration is loaded from config.sh and optionally overridden by JSON via helpers/json_to_env.py."
    - "The web app launches the same pipeline in job-specific directories under web_jobs/."
  restart_model:
    sentinel_directory: "state/"
    sentinel_pattern: "<step_name>.done"
    restart_flags:
      from_step: "bash run_pipeline.sh --from N"
      to_step: "bash run_pipeline.sh --to N"
      force_rerun: "FORCE=1 can bypass sentinel skipping"
  safety_model:
    - "Commands fail fast because Bash scripts use set -Eeuo pipefail."
    - "Missing required files and commands are checked before expensive steps."
    - "GPU mdrun has a CPU fallback when GPU execution fails."
    - "ACPYPE runtime and ligand charge are preflight-checked before ligand topology generation."
    - "Topology preflight is performed after solvation and before ion insertion."

directory_map:
  root_files:
    run_pipeline.sh: "Main orchestrator."
    config.sh: "Default runtime and scientific configuration."
    config.example.json: "Example JSON override configuration."
    setup_ubuntu.sh: "Environment setup helper for Ubuntu-like systems."
    requirements.txt: "Python package requirements."
    environment.yml: "Conda environment specification."
